[project]
site_name = "We Got This! Architecture"
docs_dir = "portal"
site_dir = ".build/site"
repo_url = "https://github.com/wgt-system/architecture"
repo_name = "wgt-system/architecture"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Overview" = "index.md" },
  { "System Landscape" = "system-landscape.md" },
  { "Bounded Contexts" = [
      { "Wiiii Got This" = "bounded-contexts/wgt.md" },
      { "Vocation" = "bounded-contexts/vocation.md" },
      { "Illumination" = "bounded-contexts/illumination.md" },
      { "Conveyance" = "bounded-contexts/conveyance.md" },
      { "Orientation" = "bounded-contexts/orientation.md" },
  ] },
  { "Capabilities" = "authority/capabilities.md" },
  { "Integration" = "authority/integration-policy.md" },
  { "Decisions" = [
      { "Index" = "decisions/index.md" },
      { "ADR-0001" = "decisions/0001.md" },
      { "ADR-0002" = "decisions/0002.md" },
      { "ADR-0003" = "decisions/0003.md" },
  ] },
  { "Reference" = [
      { "Architecture Principles" = "authority/principles.md" },
      { "System Context" = "authority/system-context.md" },
      { "Service Catalog" = "authority/services.md" },
  ] },
]

[project.theme]
features = ["navigation.sections", "navigation.top", "navigation.path", "content.code.copy"]

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
